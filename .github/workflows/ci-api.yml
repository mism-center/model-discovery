# CI for the Gateway API service: tests, formatting (ruff), linting (ruff), type checking (mypy), and Docker image build.
name: CI (API)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test, lint, and build API image
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Check formatting
        run: make format-check

      - name: Run Ruff lint checks
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build Docker image
        run: docker build -t mismapi:ci .

  integration-test:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true


      - name: Install test dependencies
        working-directory: api
        run: uv sync --group dev

      - name: Start services
        run: docker compose -f docker-compose.test.yaml up -d --build --wait

      - name: Run integration tests
        working-directory: api
        run: uv run pytest tests/test_integration.py -m integration -v

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v
