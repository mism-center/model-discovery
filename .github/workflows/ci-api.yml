# CI for the Gateway API service: tests, formatting (ruff), linting (ruff), type checking (mypy), and Docker image build.
name: CI (API)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    name: Test, lint, and build API image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Check formatting
        run: make format-check

      - name: Run Ruff lint checks
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build Docker image
        run: make image-build IMAGE_TAG=mismapi:ci
