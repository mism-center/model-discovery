# CI for the Gateway API service: tests, formatting (ruff), linting (ruff), type checking (mypy), and Docker image build.
name: CI (API)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test, lint, and build API image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src tests

      - name: Build Docker image
        run: docker build --build-arg GIT_TOKEN=${{ secrets.GITHUB_TOKEN }} -t mismapi:ci .

  integration-test:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install test dependencies
        working-directory: api
        run: uv sync --group dev

      - name: Start services
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker compose -f docker-compose.test.yaml up -d --build --wait

      - name: Run integration tests
        working-directory: api
        run: uv run pytest tests/test_integration.py -m integration -v

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yaml down -v
