apiVersion: v1
kind: ConfigMap
metadata:
  name: mism-gateway-api-config
  labels:
    {{- include "mism-gateway-api.labels" . | nindent 4 }}
data:
  # ── Gateway ─────────────────────────────────
  GATEWAY_PORT: {{ .Values.gateway.service.port | quote }}
  SEARCH_SERVICE_URL: {{ .Values.gateway.env.SEARCH_SERVICE_URL | quote }}
  UPLOAD_SERVICE_URL: {{ .Values.gateway.env.UPLOAD_SERVICE_URL | quote }}
  OIDC_SERVICE_URL: {{ .Values.gateway.env.OIDC_SERVICE_URL | quote }}

  # ── Metadata Store ───────────────────────────
  METADATA_STORE_HOST: "metadata-store"
  METADATA_STORE_PORT: {{ .Values.metadataStore.service.port | quote }}
  METADATA_DB_NAME: {{ .Values.metadataStore.env.MONGO_INITDB_DATABASE | quote }}

  # ── ACL DB ───────────────────────────────────
  ACL_DB_HOST: "acl-db"
  ACL_DB_PORT: {{ .Values.aclDb.service.port | quote }}
  ACL_DB_NAME: {{ .Values.aclDb.env.POSTGRES_DB | quote }}
  ACL_DB_USER: {{ .Values.aclDb.env.POSTGRES_USER | quote }}

  # ── Storage Interface ────────────────────────
  STORAGE_INTERFACE_URL: "http://storage-interface:{{ .Values.storageInterface.service.port }}"
  STORAGE_BACKEND: {{ .Values.storageInterface.env.BACKEND | quote }}
  BLOB_STORAGE_BUCKET: {{ .Values.storageInterface.env.BLOB_STORAGE_BUCKET | quote }}

  # ── Blob Storage (MinIO) ─────────────────────
  MINIO_ENDPOINT: "http://blob-storage:{{ .Values.blobStorage.service.apiPort }}"
  MINIO_ROOT_USER: {{ .Values.blobStorage.env.MINIO_ROOT_USER | quote }}
