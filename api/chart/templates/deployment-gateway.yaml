{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-gateway
  labels:
    {{- include "mism-gateway-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "mism-gateway-api.selectorLabels" (dict "component" "gateway" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mism-gateway-api.selectorLabels" (dict "component" "gateway" "context" $) | nindent 8 }}
    spec:
      {{- include "mism-gateway-api.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: discovery-gateway
          image: "{{ .Values.global.imageRegistry }}{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.gateway.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
