{{- if .Values.uploadService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  labels:
    {{- include "mism-gateway-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: upload-service
spec:
  replicas: {{ .Values.uploadService.replicaCount }}
  selector:
    matchLabels:
      {{- include "mism-gateway-api.selectorLabels" (dict "component" "upload-service" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mism-gateway-api.selectorLabels" (dict "component" "upload-service" "context" $) | nindent 8 }}
    spec:
      {{- include "mism-gateway-api.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: upload-service
          image: "{{ .Values.global.imageRegistry }}{{ .Values.uploadService.image.repository }}:{{ .Values.uploadService.image.tag }}"
          imagePullPolicy: {{ .Values.uploadService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.uploadService.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.uploadService.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.uploadService.resources | nindent 12 }}
{{- end }}
