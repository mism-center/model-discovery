# ──────────────────────────────────────────────
# Discovery Gateway REST API
# ──────────────────────────────────────────────
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: discovery-gateway
  labels:
    {{- include "mism-gateway-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "mism-gateway-api.selectorLabels" (dict "component" "gateway" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ──────────────────────────────────────────────
# Search Service
# ──────────────────────────────────────────────
{{- if .Values.searchService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: search-service
