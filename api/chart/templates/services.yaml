    {{- include "mism-gateway-api.selectorLabels" (dict "component" "search-service" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.searchService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
