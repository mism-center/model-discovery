[project]
name = "mism-api"
version = "0.1.0"
description = "MISM gateway API built with FastAPI."
readme = { content-type = "text/markdown", text = """# MISM Gateway API

Gateway REST API for MISM, built with FastAPI. It fronts internal microservices for search and uploads, and supports configurable bearer-token auth (only OIDC currently).
""" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10.1",
    "redis[hiredis]>=5.0.0",
    "uvicorn[standard]>=0.35.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "mism-registry[postgres] @ git+https://github.com/mism-center/metadata-schema.git@develop",
    "pathvalidate>=3.3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "respx>=0.21",
    "ruff>=0.12.11",
    "types-authlib>=1.6.11.20260418",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mismapi"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires running Docker services (docker compose)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() / Query() in FastAPI endpoint defaults is idiomatic

[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = []
