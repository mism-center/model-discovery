io:
  inputs:
    parameters:
      - name: initial_ligand
        description: "Initial external ligand concentration for receptor initialization."
        default_value: 5.0
        unit: {value: millimolar, iri: "http://purl.obolibrary.org/obo/UO_0000063", ontology_label: millimolar, ontology: uo, mapping_confidence: high}
        biological_meaning: {value: ligand concentration, iri: "http://semanticscience.org/resource/SIO_001088", ontology_label: concentration, ontology: sio, mapping_confidence: medium}
        source: "chemotaxis/processes/chemoreceptor_cluster.py:89-91"
        confidence: high
      - name: n_flagella
        description: "Number of flagella represented by the motor process."
        default_value: 4
        unit: null
        biological_meaning: {value: flagellar count, iri: null, ontology: sbo, mapping_confidence: none}
        source: "chemotaxis/processes/flagella_motor.py:43-47"
        confidence: high
      - name: time_step
        description: "Vivarium process update interval."
        default_value: 0.01
        unit: {value: seconds, iri: null, ontology: uo, mapping_confidence: none}
        biological_meaning: {value: simulation timestep, iri: null, ontology: sio, mapping_confidence: none}
        source: "chemotaxis/processes/flagella_motor.py:45"
        confidence: high
      - name: k_meth
        description: "Catalytic methylation rate in the receptor adaptation model."
        default_value: 0.0625
        unit: {value: per second, iri: null, ontology: uo, mapping_confidence: none}
        biological_meaning: {value: methylation rate, iri: null, ontology: go, mapping_confidence: none}
        source: "chemotaxis/processes/chemoreceptor_cluster.py:102"
        confidence: high
      - name: environment_volume
        description: "Environment volume used by transport/metabolism experiments."
        default_value: "1e-6 L (default); 1e-13 L with --shift"
        unit: {value: liter, iri: null, ontology: uo, mapping_confidence: none}
        biological_meaning: {value: environment volume, iri: null, ontology: sio, mapping_confidence: none}
        source: "chemotaxis/composites/transport_metabolism.py:350-357"
        confidence: high
    initial_conditions:
      - name: receptor_internal_state
        value: "n_methyl=2.0; chemoreceptor_activity=1/3; CheR=0.00016; CheB=0.00028; CheB_P=0.0"
        unit: null
        source: "chemotaxis/processes/chemoreceptor_cluster.py:92-99"
        confidence: high
      - name: flagella_expression_state
        value: "transcripts initialized to zero; proteins include flagella=4, unbound ribosomes=20, unbound RNAP=10"
        unit: null
        source: "chemotaxis/composites/flagella_expression.py:126-146"
        confidence: high
    data_inputs:
      - name: transport_metabolism_reference
        purpose: "Reference timeseries used by the transport/metabolism test."
        format: {value: CSV, iri: "http://edamontology.org/format_3752", ontology_label: CSV, ontology: edam, mapping_confidence: high}
        required: true
        source: "chemotaxis/composites/transport_metabolism.py:344-346; chemotaxis/reference_data/transport_metabolism.csv"
  outputs:
    - name: emitted_timeseries
      description: "Vivarium emitted state timeseries including receptor activity, methylation, motor state, membrane potential, metabolism, transport, and expression state."
      quantity_kind: {value: concentration, iri: "http://semanticscience.org/resource/SIO_001088", ontology_label: concentration, ontology: sio, mapping_confidence: medium}
      unit: null
      format: {value: CSV, iri: "http://edamontology.org/format_3752", ontology_label: CSV, ontology: edam, mapping_confidence: high}
      destination: "out/"
      source: "chemotaxis/composites/transport_metabolism.py:344-346; chemotaxis/composites/flagella_expression.py:396-431"
    - name: simulation_plots
      description: "Simulation-output, gene-expression, receptor, motor-activity, topology, and trajectory plots."
      quantity_kind: {value: spatial specification, iri: "http://semanticscience.org/resource/SIO_000317", ontology_label: spatial specification, ontology: sio, mapping_confidence: medium}
      unit: null
      format: {value: plot image, iri: null, ontology: edam, mapping_confidence: none}
      destination: "out/processes/ or out/composites/ or out/experiments/"
      source: "chemotaxis/__init__.py:7-9; chemotaxis/experiments/control.py:65-89"
  experiment_protocol:
    description: "Vivarium experiments initialize process/composite state, apply ligand or environmental timelines, advance in discrete updates, and emit timeseries for plotting or comparison."
    timestep: {value: "process-specific; examples 0.01, 0.1, 1, and 10", unit: seconds, source: "chemotaxis/processes/flagella_motor.py:45; chemotaxis/composites/chemotaxis_minimal.py:72-74", confidence: high}
    duration: {value: "experiment-specific; examples 60, 500, 2500, and 4000", unit: seconds, source: "chemotaxis/composites/chemotaxis_master.py:281; chemotaxis/composites/flagella_expression.py:499-540", confidence: high}
    observables: [chemoreceptor_activity, n_methyl, CheY_P, motile_state, thrust, torque, PMF, volume, mass, transcripts, proteins, internal metabolites]
    source: "chemotaxis/processes/chemoreceptor_cluster.py:113-131; chemotaxis/processes/flagella_motor.py:79-121"
