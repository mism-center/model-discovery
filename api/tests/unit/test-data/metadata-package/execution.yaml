        - {name: "--expression", description: "Run the expression mode; mutually exclusive with --variable.", default: false, enums: null, data_type: bool, position: 0, user_can_override: true}
        - {name: "--flagella", description: "Number of flagella.", default: 5, enums: null, data_type: int, position: 0, user_can_override: true}
