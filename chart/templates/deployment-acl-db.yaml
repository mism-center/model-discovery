{{- if .Values.aclDb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: acl-db
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: acl-db
spec:
  serviceName: acl-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "model-discovery.selectorLabels" (dict "component" "acl-db" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-discovery.selectorLabels" (dict "component" "acl-db" "context" $) | nindent 8 }}
    spec:
      {{- include "model-discovery.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: postgres
          image: "{{ .Values.global.imageRegistry }}{{ .Values.aclDb.image.repository }}:{{ .Values.aclDb.image.tag }}"
          imagePullPolicy: {{ .Values.aclDb.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.aclDb.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.aclDb.env.POSTGRES_DB | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.aclDb.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-discovery-secrets
                  key: aclDbPassword
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.aclDb.env.POSTGRES_USER }}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.aclDb.env.POSTGRES_USER }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.aclDb.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  {{- if .Values.aclDb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.aclDb.persistence.storageClass }}
        storageClassName: {{ .Values.aclDb.persistence.storageClass }}
        {{- else if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.aclDb.persistence.size }}
  {{- end }}
{{- end }}
