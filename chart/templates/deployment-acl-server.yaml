{{- if .Values.aclServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acl-server
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: acl-server
spec:
  replicas: {{ .Values.aclServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "model-discovery.selectorLabels" (dict "component" "acl-server" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-discovery.selectorLabels" (dict "component" "acl-server" "context" $) | nindent 8 }}
    spec:
      {{- include "model-discovery.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: acl-server
          image: "{{ .Values.global.imageRegistry }}{{ .Values.aclServer.image.repository }}:{{ .Values.aclServer.image.tag }}"
          imagePullPolicy: {{ .Values.aclServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.aclServer.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.aclServer.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: ACL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-discovery-secrets
                  key: aclDbPassword
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.aclServer.resources | nindent 12 }}
{{- end }}
