{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-gateway
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "model-discovery.selectorLabels" (dict "component" "gateway" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-discovery.selectorLabels" (dict "component" "gateway" "context" $) | nindent 8 }}
    spec:
      {{- include "model-discovery.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: discovery-gateway
          image: "{{ .Values.global.imageRegistry }}{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            # DATABASE_URL is assembled from metadata-store values + secret password.
            # The $(DATABASE_PASSWORD) is resolved by Kubernetes variable expansion.
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-discovery-secrets
                  key: databasePassword
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.metadataStore.env.POSTGRES_USER }}:$(DATABASE_PASSWORD)@metadata-store:{{ .Values.metadataStore.service.port }}/{{ .Values.metadataStore.env.POSTGRES_DB }}"
            {{- range $key, $val := .Values.gateway.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- if and .Values.redis .Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ printf "redis://%s:6379/0" (include "model-discovery.redis.masterHostname" .) | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- if .Values.storage.mountIrodsPvc }}
          volumeMounts:
            - name: irods-data
              mountPath: {{ .Values.storage.irodsMountPath }}
              readOnly: {{ .Values.storage.readOnly }}
          {{- end }}
      {{- if .Values.storage.mountIrodsPvc }}
      volumes:
        - name: irods-data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.irodsPvcName }}
            readOnly: {{ .Values.storage.readOnly }}
      {{- end }}
{{- end }}