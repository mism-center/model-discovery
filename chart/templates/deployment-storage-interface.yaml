{{- if .Values.storageInterface.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-interface
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-interface
spec:
  replicas: {{ .Values.storageInterface.replicaCount }}
  selector:
    matchLabels:
      {{- include "model-discovery.selectorLabels" (dict "component" "storage-interface" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-discovery.selectorLabels" (dict "component" "storage-interface" "context" $) | nindent 8 }}
    spec:
      {{- include "model-discovery.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: storage-interface
          image: "{{ .Values.global.imageRegistry }}{{ .Values.storageInterface.image.repository }}:{{ .Values.storageInterface.image.tag }}"
          imagePullPolicy: {{ .Values.storageInterface.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.storageInterface.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.storageInterface.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-discovery-secrets
                  key: minioRootPassword
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.storageInterface.resources | nindent 12 }}
{{- end }}
