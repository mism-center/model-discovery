{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-discovery-ingress
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API + auto-docs live at {{ .Values.ui.apiPath }} so the UI can own "/".
          # Longer prefix listed first so nginx matches it before "/".
          - path: {{ .Values.gateway.env.API_PATH_PREFIX }}
            pathType: Prefix
            backend:
              service:
                name: discovery-gateway
                port:
                  name: http
          # UI frontend – serves all other requests
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http

{{- end }}
