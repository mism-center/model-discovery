{{- $apiPathPrefix := trimSuffix "/" (.Values.gateway.env.API_PATH_PREFIX | default "") -}}
{{- $publicApiPath := .Values.gateway.env.API_PATH_PREFIX | default "/" -}}
{{- $internalApiPath := printf "%s/internal" $apiPathPrefix -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: model-discovery-ingress
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{ if .Values.ingress.blockInternalApi }}
          # Block internal infrastructure endpoints from public ingress. tusd
          # should call discovery-gateway directly via ClusterIP instead.
          # This longer prefix must be listed before the broader API prefix.
          - path: {{ $internalApiPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: discovery-internal-api-blocker
                port:
                  name: http
          {{ end }}
          # API + auto-docs live at {{ $publicApiPath }} so the UI can own "/".
          # Longer prefix listed before "/$publicApiPath" so ingress matches it first.
          - path: {{ $publicApiPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: discovery-gateway
                port:
                  name: http
          # UI frontend – serves all other requests
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  name: http
{{- end }}
