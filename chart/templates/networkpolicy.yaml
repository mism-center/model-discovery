{{- if .Values.networkPolicy.enabled }}
{{/*
  networkpolicy.yaml
  ─────────────────────────────────────────────────────────────────────────────
  Enforces the communication paths shown in the architecture diagram.
  Default posture: deny-all ingress for THIS release's pods only (scoped via
  app.kubernetes.io/instance), then open only the exact paths each component
  legitimately needs. Other workloads sharing the namespace are unaffected.

  Allowed call graph (→ = may initiate connection):
    Ingress controller  → Gateway
    Gateway             → Search Service
    Gateway             → Upload Service
    Gateway             → Redis (when bundled subchart is enabled)
    Gateway / Migrate   → Metadata Store (PostgreSQL)
    Upload Service      → Storage Interface
    tusd                → Gateway     (HTTP hooks, /api/internal/tusd/hooks; gateway
                                       trusts the transport because /api/internal/*
                                       has no app-layer auth on post-finish — see
                                       api/.../api/internal.py. tusd is deployed by
                                       a separate Helm chart, so the source pod
                                       selector is configured via values.)
  ─────────────────────────────────────────────────────────────────────────────
*/}}

# ── 0. Default-deny ingress for this release's pods ──────────────────────────
# Scoped to app.kubernetes.io/instance={{ .Release.Name }} so unrelated workloads
# sharing the namespace (other Helm releases, ad-hoc pods) are not affected.
# Subchart pods (e.g. bundled redis) carry the same instance label and are
# therefore included; they get explicit allow rules below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress

---
# ── 1. Discovery Gateway – accepts traffic from the Ingress controller only ───
{{- if .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | default "ingress-nginx" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
{{- end }}

---
# ── 1b. Redis (Bitnami subchart) – accepts traffic from Gateway only ─────────
{{- if and .Values.redis .Values.redis.enabled .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-redis
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 6379
{{- end }}

---
# ── 1c. Discovery Gateway – also accepts tusd hook callbacks ──────────────────
# tusd posts every enabled hook event (pre-create, post-finish, ...) to
# POST /api/internal/tusd/hooks on the Gateway. pre-create authenticates
# via an upload token the client sends in tus metadata (validated server-side),
# but post-finish has no app-layer auth and instead relies on this
# NetworkPolicy to ensure only the tusd pod can reach the endpoint.
#
# tusd is NOT deployed by this chart (the legacy `uploadService` component
# is unrelated and disabled in our deployments). It ships as a separate
# Helm chart that we deploy into the SAME namespace as this release; the
# source pod selector is supplied via `.Values.networkPolicy.tusd`. See
# `values.yaml` for the contract. Cross-namespace tusd is unsupported
# here on purpose — add a namespaceSelector option back if that ever
# becomes a real deployment shape.
{{- if and .Values.gateway.enabled .Values.networkPolicy.tusd .Values.networkPolicy.tusd.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tusd-to-gateway-hooks
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            {{- toYaml .Values.networkPolicy.tusd.podSelectorLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.port }}
{{- end }}

---
# ── 2. Search Service – accepts traffic from Gateway only ─────────────────────
{{- if .Values.searchService.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-search
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: search-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.searchService.service.port }}
{{- end }}

---
# ── 3. Upload Service – accepts traffic from Gateway only ─────────────────────
{{- if .Values.uploadService.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-upload
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: upload-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.uploadService.service.port }}
{{- end }}

---
# ── 4. Storage Interface – accepts traffic from Upload Service only ────────────
{{- if .Values.storageInterface.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-upload-to-storage-interface
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: storage-interface
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: upload-service
      ports:
        - protocol: TCP
          port: {{ .Values.storageInterface.service.port }}
{{- end }}

---
# ── 5. Metadata Store (PostgreSQL) – accepts traffic from Gateway + Migrate ───
{{- if .Values.metadataStore.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-db
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: metadata-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Gateway pods
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
        # Migration Job pods
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: migrate
      ports:
        - protocol: TCP
          port: {{ .Values.metadataStore.service.port }}
{{- end }}

{{- if .Values.networkPolicy.restrictEgress }}
---
# ── 6. Restrict egress – allow only DNS + known intra-namespace targets ──────
# Scoped to this release's pods (app.kubernetes.io/instance) for the same
# reason as policy #0; we don't want to clamp unrelated workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-restrict-egress
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}

{{- end }}{{/* networkPolicy.enabled */}}
