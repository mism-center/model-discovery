{{/*
  secrets.yaml
  ─────────────────────────────────────────────────────────────────────────────
  Two mutually exclusive modes, toggled by externalSecrets.enabled:

  MODE A – externalSecrets.enabled: false  (default)
    A plain Opaque Secret is rendered from values.  Use this for local dev /
    CI.  Never commit real credentials; pass them via --set or a sealed-values
    file at deploy time.

  MODE B – externalSecrets.enabled: true
    An ExternalSecret CR is rendered instead (requires the External Secrets
    Operator, https://external-secrets.io).  The operator fetches the real
    values from the configured store (Vault, AWS SM, GCP SM, Azure KV …) and
    reconciles a real Secret called "model-discovery-secrets" automatically.
    The plain Secret block is suppressed so the two never conflict.
  ─────────────────────────────────────────────────────────────────────────────
*/}}

{{- if not .Values.externalSecrets.enabled }}
# ── MODE A: plain Secret (dev / CI) ──────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: model-discovery-secrets
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # prevent accidental deletion on helm upgrade
type: Opaque
stringData:
  mongoRootUsername:    {{ .Values.secrets.mongoRootUsername    | quote }}
  mongoRootPassword:    {{ .Values.secrets.mongoRootPassword    | quote }}
  aclDbPassword:        {{ .Values.secrets.aclDbPassword        | quote }}
  minioRootPassword:    {{ .Values.secrets.minioRootPassword    | quote }}
  keycloakAdminPassword: {{ .Values.secrets.keycloakAdminPassword | quote }}

{{- else }}
# ── MODE B: ExternalSecret (production) ──────────────────────────────────────
# Requires: External Secrets Operator (https://external-secrets.io) installed.
# The operator reads from the SecretStore defined in externalSecrets.secretStoreName
# and writes a real Secret named "model-discovery-secrets" into this namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-discovery-external-secret
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
spec:
  # How often the operator re-syncs from the upstream store
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" | quote }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "SecretStore" }}

  target:
    name: model-discovery-secrets          # name of the generated Secret
    creationPolicy: Owner                 # operator owns & garbage-collects it
    template:
      type: Opaque
      engineVersion: v2
      # Optional: merge extra static labels onto the generated Secret
      metadata:
        labels:
          {{- include "model-discovery.labels" . | nindent 10 }}

  data:
    # Each entry maps a key in the generated Secret to a path in the store.
    # Adjust remoteRef.key / property to match your secret store layout.

    - secretKey: mongoRootUsername
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath | default "mism/discovery" }}
        property: mongoRootUsername

    - secretKey: mongoRootPassword
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath | default "mism/discovery" }}
        property: mongoRootPassword

    - secretKey: aclDbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath | default "mism/discovery" }}
        property: aclDbPassword

    - secretKey: minioRootPassword
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath | default "mism/discovery" }}
        property: minioRootPassword

    - secretKey: keycloakAdminPassword
      remoteRef:
        key: {{ .Values.externalSecrets.secretPath | default "mism/discovery" }}
        property: keycloakAdminPassword
{{- end }}
