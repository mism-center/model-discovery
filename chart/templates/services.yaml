# ──────────────────────────────────────────────
# Discovery Gateway REST API
# ──────────────────────────────────────────────
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: discovery-gateway
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "model-discovery.selectorLabels" (dict "component" "gateway" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ──────────────────────────────────────────────
# Search Service
# ──────────────────────────────────────────────
{{- if .Values.searchService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: search-service
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: search-service
spec:
  type: {{ .Values.searchService.service.type }}
  selector:
    {{- include "model-discovery.selectorLabels" (dict "component" "search-service" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.searchService.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
# ──────────────────────────────────────────────
# Upload Service
# ──────────────────────────────────────────────
{{- if .Values.uploadService.enabled }}
apiVersion: v1
