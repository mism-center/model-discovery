{{- end }}
---
# ──────────────────────────────────────────────
# Storage Interface (iRODS / LakeFS)
# ──────────────────────────────────────────────
{{- if .Values.storageInterface.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: storage-interface
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-interface
spec:
  type: {{ .Values.storageInterface.service.type }}
  selector:
    {{- include "model-discovery.selectorLabels" (dict "component" "storage-interface" "context" $) | nindent 4 }}
  ports:
    - name: http
