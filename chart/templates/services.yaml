{{- end }}
---
# ──────────────────────────────────────────────
# Metadata Store (PostgreSQL)
# ──────────────────────────────────────────────
{{- if .Values.metadataStore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: metadata-store
  labels:
    {{- include "model-discovery.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-store
spec:
  type: {{ .Values.metadataStore.service.type }}
  selector:
    {{- include "model-discovery.selectorLabels" (dict "component" "metadata-store" "context" $) | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.metadataStore.service.port }}
      targetPort: postgres
      protocol: TCP
{{- end }}
