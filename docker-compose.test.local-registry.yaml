# LOCAL-ONLY override — points the test stack's mism-registry install at the
# uncommitted metadata-schema working tree instead of the pinned
# git+...@develop ref (api/pyproject.toml:20), so MISM-291's Phase 1/3
# registry changes are actually exercised. Not for CI; delete when the
# metadata-schema PR merges and the pin is bumped.
#
# Usage (from model-discovery/):
#   docker compose -f docker-compose.test.yaml -f docker-compose.test.local-registry.yaml up -d --wait
services:
  migrate:
    user: root  # /app/.venv is root-owned from the image build; app user can't install into it
    volumes:
      - ../metadata-schema:/metadata-schema:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        uv pip install --python /app/.venv/bin/python -e "/metadata-schema[postgres]" &&
        python -c "from alembic.config import Config; from alembic import command;
        import mism_registry.backends.migrations as m; import os; cfg = Config();
        cfg.set_main_option('script_location', os.path.dirname(m.__file__));
        cfg.set_main_option('sqlalchemy.url', os.environ['MISM_DAL_DATABASE_URL']);
        command.upgrade(cfg, 'head'); print('Migrations complete')"

  api:
    user: root
    volumes:
      - ../metadata-schema:/metadata-schema:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        uv pip install --python /app/.venv/bin/python -e "/metadata-schema[postgres]" &&
        exec uvicorn --app-dir src mismapi.main:app --host 0.0.0.0 --port 8000
