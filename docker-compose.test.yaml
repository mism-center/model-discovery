services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mism_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: api
      args:
        GIT_TOKEN: ${GIT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      MISM_DAL_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/mism_test"
    entrypoint: ["python", "-c", "
from alembic.config import Config;
from alembic import command;
import mism_registry.backends.migrations as m;
import os;
cfg = Config();
cfg.set_main_option('script_location', os.path.dirname(m.__file__));
cfg.set_main_option('sqlalchemy.url', os.environ['MISM_DAL_DATABASE_URL']);
command.upgrade(cfg, 'head');
print('Migrations complete')
      "]

  api:
    build:
      context: api
      args:
        GIT_TOKEN: ${GIT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/mism_test"
      DISABLE_AUTH: "true"
      STUB_UPSTREAM_SERVICES: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 5s
      retries: 10
